<!DOCTYPE html>
<html>

<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>
  <a-scene>
    <a-assets>
      <img id="cursorTexture"
        src="ASSETS/precision.png">
    </a-assets>

    <a-sky src="ASSETS/sky.jpg"></a-sky>

    <a-image id="winImage"
      src="ASSETS/win.png"
      position="0 10 -2"
      width="4"
      height="4"
      visible="false"></a-image>

    <a-image id="lossImage"
      src="ASSETS/loss.png"
      position="0 10 -2"
      width="4"
      height="4"
      visible="false"></a-image>

    <a-text id="score"
      value="Score: 0"
      position="-2 6 -2"
      color="#FFF"
      width="6"></a-text>

    <a-text id="timer"
      value="Time: 30"
      position="0 6 -2"
      color="#FFF"
      width="6"></a-text>

    <a-text id="ballsLeft"
      value="Balls: Unlimited"
      position="2 6 -2"
      color="#FFF"
      width="6"></a-text>

    <a-text id="gameStatus"
      value="Game Starting..."
      position="0 5 -2"
      color="#FFF"
      width="6"></a-text>


    <a-entity camera
      look-controls
      position="0 2 10">
      <a-cursor material="src: #cursorTexture; transparent: true; alphaTest: 0.5; side: double"
        geometry="primitive: plane; height: 0.1; width: 0.1"></a-cursor>
    </a-entity>
  </a-scene>

  <script>
    let score = 0;
    let ballsLeft = 999; // Unlimited balls
    let timeLeft = 30;
    let gameActive = false;
    let gameStarted = false;
    let targetsHit = 0;

    const ballPool = [];
    const poolSize = 5;
    const activeTargets = [];
    const targetPool = [];
    const targetPoolSize = 10;

    // Create a pool of ball elements
    for (let i = 0; i < poolSize; i++) {
      const ball = document.createElement('a-sphere');
      ball.setAttribute('radius', '0.2');
      ball.setAttribute('color', '#6c75e0');
      ball.setAttribute('visible', 'false');
      ball.setAttribute('dynamic-body', '');
      ballPool.push(ball);
      document.querySelector('a-scene').appendChild(ball);
    }

    // Create a pool of target elements
    for (let i = 0; i < targetPoolSize; i++) {
      const target = document.createElement('a-image');
      target.setAttribute('src', 'ASSETS/icon-128.png');
      target.setAttribute('width', '2');
      target.setAttribute('height', '3');
      target.setAttribute('visible', 'false');
      target.className = 'target';
      targetPool.push(target);
      document.querySelector('a-scene').appendChild(target);
    }

    // Start game after 3 seconds
    setTimeout(() => {
      startGame();
    }, 3000);

    function startGame() {
      gameActive = true;
      gameStarted = true;
      document.getElementById('gameStatus').setAttribute('value', 'Game Active!');

      // Start the timer
      const timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          clearInterval(targetSpawnInterval);
          endGame();
        }
      }, 1000);

      // Spawn targets every 2 seconds
      const targetSpawnInterval = setInterval(() => {
        if (gameActive) {
          spawnRandomTarget();
        }
      }, 2000);

      // Spawn first target immediately
      spawnRandomTarget();
    }

    function spawnRandomTarget() {
      const target = getAvailableTarget();
      if (!target) return;

      // Random position in front of the player
      const x = (Math.random() - 0.5) * 16; // -8 to 8
      const y = Math.random() * 8 + 1; // 1 to 9
      const z = -5 - Math.random() * 10; // -5 to -15

      target.setAttribute('position', `${x} ${y} ${z}`);
      target.setAttribute('visible', 'true');
      activeTargets.push(target);

      // Remove target after 5 seconds if not hit
      setTimeout(() => {
        if (target.getAttribute('visible')) {
          target.setAttribute('visible', 'false');
          const index = activeTargets.indexOf(target);
          if (index > -1) {
            activeTargets.splice(index, 1);
          }
        }
      }, 5000);
    }

    function getAvailableTarget() {
      for (const target of targetPool) {
        if (!target.getAttribute('visible')) {
          return target;
        }
      }
      return null;
    }

    function endGame() {
      gameActive = false;

      // Hide all active targets
      activeTargets.forEach(target => {
        target.setAttribute('visible', 'false');
      });
      activeTargets.length = 0;

      // Show final results
      document.getElementById('gameStatus').setAttribute('value', `Game Over! Targets Hit: ${targetsHit}`);

      if (targetsHit >= 5) {
        showingImageWin();
      } else {
        showingImageLoss();
      }
    }

    // Event listeners
    document.addEventListener('keydown', function (event) {
      if (event.code === 'Space' && gameActive) {
        shootBall();
      }
    });

    document.addEventListener('touchstart', function (event) {
      if (gameActive) {
        shootBall();
      }
    });

    function getAvailableBall() {
      for (const ball of ballPool) {
        if (!ball.getAttribute('visible')) {
          return ball;
        }
      }
      return null;
    }

    function shootBall() {
      const ball = getAvailableBall();
      if (!ball) {
        console.log('No available balls in the pool.');
        return;
      }

      ball.setAttribute('position', '0 1 10');
      ball.setAttribute('visible', 'true');

      const camera = document.querySelector('[camera]');
      const direction = new THREE.Vector3(0, 0, -1);
      direction.applyQuaternion(camera.object3D.quaternion);

      // No need to decrement ballsLeft for unlimited balls
      updateBallsLeft();

      let distanceTraveled = 0;
      const minimumDistanceBeforeCollisionCheck = 7;

      function moveBall() {
        const currentPosition = new THREE.Vector3();
        ball.object3D.getWorldPosition(currentPosition);

        currentPosition.add(direction.clone().multiplyScalar(0.4));
        ball.setAttribute('position', currentPosition);

        distanceTraveled += 0.4;

        if (distanceTraveled > minimumDistanceBeforeCollisionCheck) {
          const raycaster = new THREE.Raycaster(currentPosition, direction);
          const intersects = raycaster.intersectObjects(document.querySelector('a-scene').object3D.children, true);

          if (intersects.length > 0) {
            const hitObject = intersects[0].object.el;
            if (hitObject && hitObject.className === 'target' && hitObject.getAttribute('visible')) {
              console.log('Hit target!');
              hitObject.setAttribute('visible', 'false');
              ball.setAttribute('visible', 'false');

              // Remove from active targets
              const index = activeTargets.indexOf(hitObject);
              if (index > -1) {
                activeTargets.splice(index, 1);
              }

              updateScore();
              return;
            }
          }
        }

        if (currentPosition.length() > 50) {
          ball.setAttribute('visible', 'false');
          return;
        }

        requestAnimationFrame(moveBall);
      }

      requestAnimationFrame(moveBall);
    }

    function updateScore() {
      targetsHit++;
      const scoreText = document.getElementById('score');
      scoreText.setAttribute('value', 'Score: ' + targetsHit);
    }

    function updateBallsLeft() {
      const ballsLeftText = document.getElementById('ballsLeft');
      ballsLeftText.setAttribute('value', 'Balls: Unlimited');
    }

    function updateTimer() {
      const timerText = document.getElementById('timer');
      timerText.setAttribute('value', 'Time: ' + timeLeft);
    }

    function showingImageWin() {
      const winImage = document.getElementById('winImage');
      winImage.setAttribute('visible', 'true');
      winImage.setAttribute('animation', 'property: position; from: 0 10 -2; to: 0 1 -2; dur: 1000; easing: easeInOutQuad;');
    }

    function showingImageLoss() {
      const lossImage = document.getElementById('lossImage');
      lossImage.setAttribute('visible', 'true');
      lossImage.setAttribute('animation', 'property: position; from: 0 10 -2; to: 0 1 -2; dur: 1000; easing: easeInOutQuad;');
    }

    // Initialize
    updateBallsLeft();
    updateTimer();
  </script>
</body>

</html>
